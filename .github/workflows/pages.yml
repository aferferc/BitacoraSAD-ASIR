name: Validar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos por defecto: solo lectura.
permissions:
  contents: read

# Un solo despliegue a la vez; no se cancela uno ya empezado.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Pruebas y construcción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q
      - name: Construir el sitio (modo estricto)
        run: python -m mkdocs build --strict
      - name: Comprobar enlaces, recursos y secretos bajo la ruta base
        run: python tools/check_site.py site
      - name: Configurar Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Subir artefacto
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  desplegar:
    name: Desplegar en GitHub Pages
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Mostrar la URL publicada
        run: echo "Sitio publicado en ${{ steps.deployment.outputs.page_url }}"
